[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyinnerbubble"
version = "0.1.0"
description = "Measurement of internal velocity fields and scalar transport in rising bubbles from PLIF/shadowgraphy imagery"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Royi Shabtay", email = "shabyben30@gmail.com" },
    { name = "Ian Jacobi" },
]
keywords = [
    "bubbles",
    "PLIF",
    "shadowgraphy",
    "optic flow",
    "data assimilation",
    "scalar transport",
    "multiphase flow",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "scipy",
    "opencv-python",
    "matplotlib",
]

[project.optional-dependencies]
segmentation = ["torch", "segment-anything"]
dev = ["pytest", "pytest-cov", "ruff"]

[project.urls]
Homepage = "https://github.com/REPLACE_ME/pyinnerbubble"
Issues = "https://github.com/REPLACE_ME/pyinnerbubble/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pyinnerbubble"]

[tool.pytest.ini_options]
testpaths = ["tests"]
