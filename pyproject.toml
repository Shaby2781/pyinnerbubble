[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyinnerbubble"
version = "0.1.0"
description = "Measurement of internal velocity fields and scalar transport in rising bubbles from PLIF/shadowgraphy imagery"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Royi Shabtay", email = "shabyben30@gmail.com" },
    { name = "Ian Jacobi" },
]
keywords = [
    "bubbles",
    "PLIF",
    "shadowgraphy",
    "optic flow",
    "data assimilation",
    "scalar transport",
    "multiphase flow",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "scipy>=1.15",
    "opencv-python-headless",
    "matplotlib",
    "shapely",
]

[project.optional-dependencies]
segmentation = ["torch", "torchvision", "segment-anything"]
dev = ["pytest", "pytest-cov", "ruff"]

[project.urls]
Homepage = "https://github.com/Shaby2781/pyinnerbubble"
Issues = "https://github.com/Shaby2781/pyinnerbubble/issues"

[project.scripts]
pyinnerbubble-segment = "pyinnerbubble.geometry.segmentation:main"
pyinnerbubble-reconstruct-shape = "pyinnerbubble.geometry.shape_reconstruction:main"
pyinnerbubble-camera-mapping = "pyinnerbubble.geometry.camera_mapping:main"
pyinnerbubble-map-velocity = "pyinnerbubble.opticflow.velocity_mapping:main"
pyinnerbubble-conformal-map = "pyinnerbubble.assimilation.conformal_mapping:main"
pyinnerbubble-build-mesh = "pyinnerbubble.assimilation.mesh:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyinnerbubble"]

[tool.pytest.ini_options]
testpaths = ["tests"]
